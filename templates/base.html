{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Welcome to Roaster AI{% endblock %}</title>
  <meta name="description"
    content="{% block description %}Get roasted by the coldest AI on the internet.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/jpeg" href="{% static 'roast.jpeg' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  {% block extra_css %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  <script>
    const s = document.createElement('script')
    s.src = "{% static 'js/roaster-session.js' %}"
    s.onload = () => {
      window._authReady = true
      document.dispatchEvent(new Event('auth:ready'))
    }
    document.body.appendChild(s)
  </script>

  {% block extra_js %}{% endblock %}
</body>

</html>
