{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Welcome to Roaster AI{% endblock %}</title>
  <meta name="description"
    content="{% block description %}Get roasted by the coldest AI on the internet.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/jpeg" href="{% static 'roast.jpeg' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  {% block extra_css %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  <!--
    Firebase initializes as an ES module (always deferred by the browser).
    Once ready it injects auth.js as a regular script so auth.js is
    guaranteed to run AFTER window._firebaseAuth and window.firebaseAuth exist.
  -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js'
    import * as fbAuth       from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js'

    const firebaseConfig = {
      apiKey:            "{{ FIREBASE_CONFIG.apiKey }}",
      authDomain:        "{{ FIREBASE_CONFIG.authDomain }}",
      projectId:         "{{ FIREBASE_CONFIG.projectId }}",
      messagingSenderId: "{{ FIREBASE_CONFIG.messagingSenderId }}",
      appId:             "{{ FIREBASE_CONFIG.appId }}",
    }

    // Warn loudly in development if config values are missing
    const missingKeys = Object.entries(firebaseConfig)
      .filter(([, v]) => !v || v.startsWith('your-') || v === 'AIzaSy...')
      .map(([k]) => k)
    if (missingKeys.length) {
      console.error('[Roaster] Firebase Web SDK config is incomplete. Missing/placeholder values for:', missingKeys)
      console.error('[Roaster] Fill in the FIREBASE_* variables in your .env file.')
    }

    const app = initializeApp(firebaseConfig)

    window._firebaseAuth  = fbAuth.getAuth(app)
    window.firebaseAuth   = fbAuth
    window._firebaseReady = true

    // Inject auth.js AFTER Firebase is on window — no race condition possible
    const s = document.createElement('script')
    s.src = "{% static 'js/auth.js' %}"
    // Fire 'auth:ready' once auth.js has fully executed.
    // Also set a flag so pages that register the listener late can still react.
    s.onload = () => {
      window._authReady = true
      document.dispatchEvent(new Event('auth:ready'))
    }
    document.body.appendChild(s)
  </script>

  {% block extra_js %}{% endblock %}
</body>

</html>
