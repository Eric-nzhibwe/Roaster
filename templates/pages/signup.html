{% extends "base.html" %}
{% load static %}
{% block title %}Create Account — Roaster AI{% endblock %}
{% block body %}
<div class="grid-bg"></div>
<button class="theme-btn" style="position:fixed;top:1.5rem;right:1.5rem;z-index:10" aria-label="Toggle theme"><i class="fa-solid fa-sun"></i></button>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;z-index:1">
  <div style="width:100%;max-width:420px" class="fade-in-up">

    <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:.5rem;justify-content:center;margin-bottom:2rem">
      <i class="fa-solid fa-fire" style="font-size:1.8rem;color:var(--teal)"></i>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.4rem;color:var(--teal)">Roaster AI</span>
    </a>
    
    <div class="glass card" style="border-radius:16px;padding:2.5rem;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent)"></div>

      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:.4rem">Create account</h1>
      <p style="color:var(--text-secondary);font-size:.875rem;margin-bottom:2rem">Brace yourself. This is going to hurt.</p>

      <div id="error-msg" style="display:none;background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.875rem;color:var(--red)"></div>

      <button id="google-btn" class="btn" style="width:100%;background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-primary);margin-bottom:1.25rem;justify-content:center;gap:.625rem" onmouseover="this.style.borderColor='var(--teal)'" onmouseout="this.style.borderColor='var(--border-subtle)'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem">
        <div style="flex:1;height:1px;background:var(--border-subtle)"></div>
        <span style="font-size:.75rem;color:var(--text-muted)">or</span>
        <div style="flex:1;height:1px;background:var(--border-subtle)"></div>
      </div>

      <form id="signup-form" style="display:flex;flex-direction:column;gap:1rem">
        <div>
          <label style="display:block;font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:.4rem;letter-spacing:.04em">DISPLAY NAME</label>
          <input type="text" id="name" class="input" placeholder="What should we call you?" required />
        </div>
        <div>
          <label style="display:block;font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:.4rem;letter-spacing:.04em">EMAIL</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div>
          <label style="display:block;font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:.4rem;letter-spacing:.04em">PASSWORD</label>
          <input type="password" id="password" class="input" placeholder="Make it strong" required autocomplete="new-password" oninput="updateStrength(this.value)" />
          <div id="strength-bar" style="margin-top:.5rem;display:none">
            <div style="height:3px;background:var(--bg-surface);border-radius:2px;overflow:hidden">
              <div id="strength-fill" style="height:100%;width:0;border-radius:2px;transition:all .3s"></div>
            </div>
            <span id="strength-label" style="font-size:.72rem;margin-top:.2rem;display:block"></span>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:.4rem;letter-spacing:.04em">CONFIRM PASSWORD</label>
          <input type="password" id="confirm" class="input" placeholder="Say it again" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;padding:.8rem;font-size:.95rem;margin-top:.25rem">
          Create Account <i class="fa-solid fa-fire"></i>
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:.875rem;color:var(--text-secondary)">
        Already have an account? <a href="/login/" style="color:var(--teal);text-decoration:none;font-weight:600">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script>
function updateStrength(pw) {
  const bar = document.getElementById('strength-bar')
  const fill = document.getElementById('strength-fill')
  const label = document.getElementById('strength-label')
  if (!pw) { bar.style.display = 'none'; return }
  bar.style.display = 'block'
  let w = '20%', color = '#FF4757', text = 'Too short'
  if (pw.length >= 6) { w = '40%'; color = '#FF6B35'; text = 'Weak' }
  if (pw.length >= 8) { w = '60%'; color = '#FFD93D'; text = 'Fair' }
  if (pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw)) { w = '80%'; color = '#00D4AA'; text = 'Good' }
  if (pw.length >= 10 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) { w = '100%'; color = '#4ADE80'; text = 'Strong' }
  fill.style.width = w; fill.style.background = color
  label.textContent = text; label.style.color = color
}

// Google — new users go straight to chat
document.getElementById('google-btn').addEventListener('click', async (e) => {
  const btn = e.currentTarget
  const errEl = document.getElementById('error-msg')
  const originalHTML = btn.innerHTML
  errEl.style.display = 'none'
  btn.disabled = true
  btn.innerHTML = '<span class="spinner spinner-teal" style="width:16px;height:16px"></span> Connecting...'

  const data = await Auth.loginWithGoogle()
  if (data?.success) {
    showToast('Welcome to Roaster AI! 🔥', 'success')
    setTimeout(() => { window.location.href = '/chat/' }, 1200)
    return
  }
  btn.disabled = false
  btn.innerHTML = originalHTML
  if (data?.error) { errEl.textContent = data.error; errEl.style.display = 'block' }
})

// Email signup — show success toast then redirect to login
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const btn = document.getElementById('submit-btn')
  const errEl = document.getElementById('error-msg')
  const pw = document.getElementById('password').value
  const confirm = document.getElementById('confirm').value

  if (pw !== confirm) {
    errEl.textContent = 'Passwords do not match.'
    errEl.style.display = 'block'; return
  }
  if (pw.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters.'
    errEl.style.display = 'block'; return
  }

  btn.disabled = true
  btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-top-color:#000"></span> Creating...'
  errEl.style.display = 'none'

  const data = await Auth.signupWithEmail(
    document.getElementById('name').value,
    document.getElementById('email').value,
    pw
  )

  if (data.success) {
    showSignupSuccess()
  } else {
    errEl.textContent = data.error || 'Signup failed'
    errEl.style.display = 'block'
    btn.disabled = false
    btn.innerHTML = 'Create Account <i class="fa-solid fa-fire"></i>'
  }
})

function showSignupSuccess() {
  // Replace the form card content with a success state
  const card = document.querySelector('.glass.card')
  card.innerHTML = `
    <div style="text-align:center;padding:1rem 0">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--teal-glow);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
        <i class="fa-solid fa-check" style="font-size:1.6rem;color:var(--teal)"></i>
      </div>
      <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:.5rem">Account created!</h2>
      <p style="color:var(--text-secondary);font-size:.875rem;line-height:1.6;margin-bottom:1.75rem">
        Your account is ready. Sign in to start getting roasted.
      </p>
      <a href="/login/?welcome=1" class="btn btn-primary" style="width:100%;padding:.8rem;font-size:.95rem;justify-content:center">
        Sign In Now <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>`
}
</script>
{% endblock %}
